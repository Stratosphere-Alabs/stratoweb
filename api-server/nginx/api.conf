server {
    listen 80;
    server_name 47.74.8.197;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    location / {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy to Node.js on localhost:3001
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache
        proxy_cache_bypass $http_upgrade;
    }

    # Admin UI (protected with Basic Auth)
    location /admin {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        alias /var/www/admin;
        try_files $uri $uri/ /index.html;
        
        # Disable caching for admin
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Admin API (protected with Basic Auth)
    location /admin-api/ {
        auth_basic "Admin API";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        # Proxy to Node.js
        proxy_pass http://127.0.0.1:3001/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }

    # Access log
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;
}
