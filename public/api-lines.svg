<svg
  width="1440"
  height="600"
  viewBox="0 0 1440 600"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 背景留空，让外面的 #F5F5F5 透出来 -->
  <defs>
    <!-- 单条波纹的形状（类似参考图那种从左到右的弧形） -->
    <path
      id="wave-line"
      d="M -80 0
         C 260 -18, 620 24, 980 -6
         S 1520 40, 1600 26"
    />
    <!-- 让右侧稍微更清楚、左侧更淡一点的渐变线色 -->
    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#E5E7EB" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#E5E7EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E5E7EB" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 多条平行波纹：从上到下逐渐变明显，线条很多、波动较大 -->
  <g
    fill="none"
    stroke="url(#waveStroke)"
    stroke-width="1.1"
    stroke-linecap="round"
  >
    <!-- 上面几条很淡 -->
    <use href="#wave-line" x="0" y="260" opacity="0.10" />
    <use href="#wave-line" x="0" y="272" opacity="0.12" />
    <use href="#wave-line" x="0" y="284" opacity="0.14" />
    <use href="#wave-line" x="0" y="296" opacity="0.16" />
    <use href="#wave-line" x="0" y="308" opacity="0.18" />
    <use href="#wave-line" x="0" y="320" opacity="0.20" />
    <use href="#wave-line" x="0" y="332" opacity="0.22" />
    <use href="#wave-line" x="0" y="344" opacity="0.24" />
    <use href="#wave-line" x="0" y="356" opacity="0.26" />
    <use href="#wave-line" x="0" y="368" opacity="0.28" />
    <use href="#wave-line" x="0" y="380" opacity="0.30" />
    <use href="#wave-line" x="0" y="392" opacity="0.32" />
    <use href="#wave-line" x="0" y="404" opacity="0.34" />
    <use href="#wave-line" x="0" y="416" opacity="0.36" />
    <use href="#wave-line" x="0" y="428" opacity="0.38" />
    <use href="#wave-line" x="0" y="440" opacity="0.40" />
    <use href="#wave-line" x="0" y="452" opacity="0.44" />
    <use href="#wave-line" x="0" y="464" opacity="0.48" />
    <use href="#wave-line" x="0" y="476" opacity="0.52" />
    <use href="#wave-line" x="0" y="488" opacity="0.56" />
    <use href="#wave-line" x="0" y="500" opacity="0.60" />
    <use href="#wave-line" x="0" y="512" opacity="0.65" />
    <use href="#wave-line" x="0" y="524" opacity="0.70" />
    <use href="#wave-line" x="0" y="536" opacity="0.76" />
    <use href="#wave-line" x="0" y="548" opacity="0.82" />
    <use href="#wave-line" x="0" y="560" opacity="0.88" />
    <use href="#wave-line" x="0" y="572" opacity="0.94" stroke-width="1.4" />
  </g>
</svg>